version: 2
updates:
  - package-ecosystem: gomod
    directory: /core
    target-branch: master
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: master
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
