name: Rollback

# Redeploy an earlier, already-published release (no rebuild). See docs/release-process.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to redeploy (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  rollback:
    name: Redeploy release to production
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read # gh attestation verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Download and verify release assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          scripts/verify-release.sh "$version" "$RUNNER_TEMP/assets"
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/assets/trail-braking-trainer_${version}_web.tar.gz" -C "$RUNNER_TEMP/site" --no-same-owner
          echo "site=$RUNNER_TEMP/site/trail-braking-trainer_${version}_web" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no caches in release/deploy jobs (cache poisoning)

      - name: Install pinned cf CLI (lockfile)
        run: npm ci --ignore-scripts

      # Workers Static Assets via the cf CLI (ADR 0008).
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE: ${{ steps.assets.outputs.site }}
        run: scripts/deploy.sh "$SITE"
